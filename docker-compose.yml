services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/riemannulus/hummingbot-dashboard:latest
    container_name: hummingbot-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - dashboard-data:/app/data

volumes:
  dashboard-data:

